[project]
name = "taskly-agent"
version = "1.0.0"
description = "Skill-driven agent that creates and verifies unit tests for pull requests."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["taskly_agent*"]
